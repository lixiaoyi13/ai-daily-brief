name: ai-daily-brief

# 时间：UTC 23:50 = 北京时间 07:50（中国无夏令时，全年固定）
# 为什么不在 00:00 UTC 整点跑：GitHub 官方文档明确说整点是调度高峰，容易排队延迟；
# 提前 10 分钟触发，脚本内部再 sleep 到 08:00 整发信，可吸收几分钟的排队抖动。
on:
  schedule:
    - cron: '50 23 * * *'   # UTC 23:50 = 北京 07:50
  workflow_dispatch: {}      # 手动测试用；手动触发时跳过等待、立即推送

permissions:
  contents: read

concurrency:
  group: ai-daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          # 渠道由仓库变量 CHANNEL 决定：dingtalk / email / feishu / serverchan；没配则默认钉钉
          CHANNEL: ${{ vars.CHANNEL || 'dingtalk' }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 ai_daily_brief.py --no-wait
          else
            python3 ai_daily_brief.py --at 08:00
          fi

      # 失败时 Actions 页面标红，GitHub 默认会给工作流维护者发失败通知邮件；
      # 脚本内部也会往同一推送渠道发一条 ❌ 通知（双保险）。
      # 若整份任务被 GitHub 丢掉（极端情况），08:15 还没收到邮件就去 Actions 页面手动重跑。
